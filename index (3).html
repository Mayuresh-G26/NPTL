<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sustainable Happiness Mock Test</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100 text-slate-800 min-h-screen"><header class="bg-slate-900 text-white"><div class="max-w-7xl mx-auto p-5 flex justify-between"><div><h1 class="text-2xl font-bold">MCQ Mock Test</h1><p class="text-slate-300">Sustainable Happiness • NPTEL</p></div><button onclick="document.body.classList.toggle('dark')" class="bg-slate-700 px-4 py-2 rounded-lg">🌙 Dark Mode</button></div></header><main class="max-w-7xl mx-auto p-5 grid lg:grid-cols-[1fr_260px] gap-5"><section class="bg-white rounded-2xl shadow p-5 md:p-7"><div class="flex justify-between flex-wrap gap-3"><div><p id="week" class="text-blue-600 font-bold"></p><h2 class="text-2xl font-bold">Sustainable Happiness</h2><p class="text-sm text-slate-500">50 Questions • 100 Marks</p></div><select id="filter" onchange="applyFilter()" class="border rounded-lg px-3 py-2"><option>All Weeks</option><option>Week 1</option><option>Week 2</option><option>Week 3</option><option>Week 4</option><option>Week 5</option><option>Week 6</option><option>Week 7</option><option>Week 8</option></select></div><div class="mt-5 flex justify-between font-bold text-sm"><span id="prog"></span><span id="score"></span></div><div class="h-3 bg-slate-200 rounded-full mt-2"><div id="bar" class="h-3 bg-blue-600 rounded-full"></div></div><div id="card" class="mt-6"></div><div class="mt-6 flex flex-wrap justify-between gap-3"><button onclick="prev()" class="px-5 py-3 border rounded-xl">← Previous</button><div class="flex gap-3"><button id="clear" onclick="clearA()" class="px-5 py-3 border rounded-xl">Clear Answer</button><button id="submit" onclick="submitA()" class="px-6 py-3 bg-green-600 text-white rounded-xl font-bold">✓ Submit Answer</button><button onclick="next()" class="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold">Next →</button></div></div></section><aside class="bg-white rounded-2xl shadow p-4 h-fit"><h3 class="font-bold text-lg">Question Palette</h3><div id="pal" class="grid grid-cols-5 gap-2 mt-3"></div><hr class="my-5"><div class="text-sm space-y-2"><div>Total: <b>50</b></div><div>Attempted: <b id="att">0</b></div><div>Correct: <b id="cor">0</b></div><div>Wrong: <b id="wro">0</b></div></div><button onclick="result()" class="w-full mt-5 py-3 bg-slate-900 text-white rounded-xl">Submit Test</button></aside></main><div id="modal" class="hidden fixed inset-0 bg-black/50 items-center justify-center p-5"><div class="bg-white rounded-2xl p-7 max-w-md w-full"><h2 class="text-2xl font-bold">Your Result 🎉</h2><div id="res" class="mt-5"></div><button onclick="closeM()" class="w-full mt-5 py-3 border rounded-xl">Close</button></div></div><script>const Q=[{"n": 1, "week": "Week 1", "q": "Sustainable happiness, as defined by O'Brien (2005), is happiness that contributes to individual, community and/or global wellbeing ___.", "o": ["while ignoring long-term consequences", "by maximizing material consumption", "without exploiting other people, the environment or future generations", "only when economic growth is above 5%"], "a": 2}, {"n": 2, "week": "Week 1", "q": "The Happy Planet Index (HPI), proposed by the New Economics Foundation, combines life satisfaction, life expectancy and equality in relation to a country's ___.", "o": ["gross domestic product", "literacy rate", "military spending", "ecological footprint"], "a": 3}, {"n": 3, "week": "Week 1", "q": "Bhutan's Gross National Happiness (GNH) index monitors ___ domains through a survey of 148 questions.", "o": ["five", "nine", "twelve", "seven"], "a": 1}, {"n": 4, "week": "Week 1", "q": "Which type of wellbeing has a built-in limitation known as the 'hedonic treadmill' and is the LESS sustainable form?", "o": ["Objective-list wellbeing", "Transcendent wellbeing", "Hedonic (pleasure-based) wellbeing", "Eudaimonic wellbeing"], "a": 2}, {"n": 5, "week": "Week 1", "q": "According to the sustainable happiness model of Lyubomirsky, Sheldon and Schkade (2005), an individual's happiness level depends on the set point, life circumstances and ___.", "o": ["cultural rituals", "intentional (effortful) activities", "income level only", "age and sex"], "a": 1}, {"n": 6, "week": "Week 1", "q": "Compared with 'satisficers', 'maximizers' who try to make the absolute best choice typically experience ___.", "o": ["no difference in wellbeing", "higher happiness set point", "greater regret and lower wellbeing", "greater satisfaction and less regret"], "a": 2}, {"n": 7, "week": "Week 1", "q": "In Seligman's model, a 'meaningful life' is one in which you ___.", "o": ["frequently do pleasurable things", "maximize wealth", "avoid all stress", "use your strengths and virtues in service of something bigger than yourself"], "a": 3}, {"n": 8, "week": "Week 2", "q": "The first United Nations conference to combine environment and development issues, which produced Agenda 21 (Chapter 36 = education), was the ___.", "o": ["Planet Summit", "Earth Summit (Rio, 1992)", "Paris Summit", "Stockholm Summit"], "a": 1}, {"n": 9, "week": "Week 2", "q": "Waters et al.'s six pathways (SEARCH) that raise students' wellbeing include all EXCEPT ___.", "o": ["identified strengths", "emotional management", "competition among peers", "coping"], "a": 2}, {"n": 10, "week": "Week 2", "q": "Environmental education and positive education share the goal of increasing wellbeing but differ because ___.", "o": ["they have different goals", "one applies only to adults", "one ignores nature", "their starting points are opposite"], "a": 3}, {"n": 11, "week": "Week 2", "q": "If children are to be happy in schools, it does not matter whether their teachers are happy or not.", "o": ["True", "False"], "a": 1}, {"n": 12, "week": "Week 2", "q": "The correct third stage of the Sustainability Through Happiness Framework (STHF) is ___.", "o": ["sustainability interventions", "profit inventory", "happiness visioning", "systems planning"], "a": 1}, {"n": 13, "week": "Week 2", "q": "According to the Happy Schools Framework, the three key categories are ___.", "o": ["Plan, Practice and Progress", "Policy, Profit and Performance", "Pupils, Parents and Principals", "People, Process and Place"], "a": 3}, {"n": 14, "week": "Week 2", "q": "The Delhi Government's Happiness Curriculum (since July 2018) is based on the 'Happiness Triad' of momentary happiness, long-term happiness and ___ happiness.", "o": ["social-media", "competitive", "sustainable", "material"], "a": 2}, {"n": 15, "week": "Week 2", "q": "Being present and attentive purposefully and non-judgmentally 'in the moment' is called ___.", "o": ["transcendence", "consciousness-raising", "mindfulness", "autonomy"], "a": 2}, {"n": 16, "week": "Week 3", "q": "___ at work is initiated by a pain trigger and an expression of suffering by the sufferer.", "o": ["Psychological safety", "Career growth", "Interpersonal capitalization", "Compassion"], "a": 3}, {"n": 17, "week": "Week 3", "q": "Which of the following is NOT a component of emotional intelligence?", "o": ["Self-conflict", "Self-awareness", "Self-regulation", "Social awareness"], "a": 0}, {"n": 18, "week": "Week 3", "q": "The ability to collectively develop and implement innovative actions that further sustainability locally and further afield is ___ competence.", "o": ["strategic", "collaboration", "normative", "anticipatory"], "a": 0}, {"n": 19, "week": "Week 3", "q": "In the Workplace Happiness Matrix, the 'Grinning' quadrant means ___.", "o": ["low employee happiness and high employer contribution", "high employee happiness and high employer contribution", "high employee happiness and low employer contribution", "low employee happiness and low employer contribution"], "a": 1}, {"n": 20, "week": "Week 3", "q": "Positive emotions at work ___ the momentary scope of attention and cognition and build enduring psychological and social resources.", "o": ["freeze", "broaden", "suppress", "narrow"], "a": 1}, {"n": 21, "week": "Week 3", "q": "People who feel unfulfilled at work are more likely to put effort into contributing toward company success.", "o": ["True", "False"], "a": 1}, {"n": 22, "week": "Week 4", "q": "Sustainability in organizations is commonly understood through the ___ bottom-line approach (financial, social, environmental).", "o": ["quadruple", "single", "double", "triple"], "a": 3}, {"n": 23, "week": "Week 4", "q": "'A sense of belonging in an environment where all feel welcomed, accepted and respected' defines ___.", "o": ["inclusion", "diversity", "equity", "compliance"], "a": 0}, {"n": 24, "week": "Week 4", "q": "Corporate Social Responsibility (CSR) is best described as ___.", "o": ["only earning money for shareholders", "going beyond the law's requirements to protect the interests of all stakeholders", "a marketing-only activity", "meeting minimum legal compliance"], "a": 1}, {"n": 25, "week": "Week 4", "q": "Which of the following is a challenge for sustainable organizations?", "o": ["Supply chain complexity", "Resistance to change", "Balancing cost with sustainability", "All of the above"], "a": 3}, {"n": 26, "week": "Week 4", "q": "Optimal stress that improves performance is called ___, while excessive stress that harms wellbeing is called distress.", "o": ["apathy", "eustress", "inertia", "burnout"], "a": 1}, {"n": 27, "week": "Week 4", "q": "The iterative steps for building a resilient organization are ___.", "o": ["Attack, Defend, Retreat", "Anticipate, Adapt, Assess", "Plan, Do, Check", "Recruit, Retain, Reward"], "a": 1}, {"n": 28, "week": "Week 5", "q": "'Presencing' refers to the combination of presence and ___.", "o": ["sustainability", "security", "pretending", "sensing"], "a": 3}, {"n": 29, "week": "Week 5", "q": "By disclosing the bad news as well as the good, sustainable leaders illustrate ___.", "o": ["transparency", "autonomy", "open-mindedness", "resilience"], "a": 0}, {"n": 30, "week": "Week 5", "q": "The three principles of the transformative mindset are humans@centre, technology@speed and ___.", "o": ["innovation@scale", "profit@scale", "policy@speed", "competition@centre"], "a": 0}, {"n": 31, "week": "Week 5", "q": "The conscience and values of leaders are referred to as their ___.", "o": ["surface voice", "outer voice", "deep voice", "inner voice"], "a": 3}, {"n": 32, "week": "Week 5", "q": "___ is a critical element in the recruitment process for a sustainable leader.", "o": ["Use of jargon", "Extensive use of references", "Symbols", "Social media alone"], "a": 1}, {"n": 33, "week": "Week 5", "q": "Environmentally friendly actions improve feelings of wellbeing only for people in rich countries.", "o": ["True", "False"], "a": 1}, {"n": 34, "week": "Week 6", "q": "Forgiveness comes under the virtue of ___.", "o": ["wisdom and knowledge", "courage", "transcendence", "temperance"], "a": 3}, {"n": 35, "week": "Week 6", "q": "Philip Dennett's creative ecosystem consists of three interconnecting cogs: management culture, the operating environment and ___.", "o": ["individual creativity", "market share", "financial capital", "technology"], "a": 0}, {"n": 36, "week": "Week 6", "q": "Teresa Amabile (1988) sees creativity as a process with ___ steps.", "o": ["7", "2", "5", "3"], "a": 2}, {"n": 37, "week": "Week 6", "q": "A default allocation of workers' pay into a retirement fund is an example of a ___ nudge.", "o": ["pro-social", "coercive", "pro-self", "marketing"], "a": 2}, {"n": 38, "week": "Week 6", "q": "The three principal areas of green consumption are green energy, green food and ___.", "o": ["green finance", "green tourism", "green clothing", "green gadgets"], "a": 2}, {"n": 39, "week": "Week 6", "q": "Which of the following is NOT a characteristic of the state of 'flow'?", "o": ["Clear goals", "Distorted sense of time", "Constant worry about failure", "Immediate feedback"], "a": 2}, {"n": 40, "week": "Week 7", "q": "In the HDLB approach (Having, Doing, Loving, Being), 'Being' is largely about ___.", "o": ["only owning assets", "consumption", "avoiding responsibility", "All of these: self-actualization, being true to one's calling, flourishing"], "a": 3}, {"n": 41, "week": "Week 7", "q": "Which of the following is NOT a resource under material wellbeing?", "o": ["Food", "Income", "Love", "Assets"], "a": 3}, {"n": 42, "week": "Week 7", "q": "The triple bottom line of sustainability was first mentioned in the ___.", "o": ["Brundtland Report (1987)", "Paris Agreement", "Kyoto Protocol", "Berlin Declaration"], "a": 2}, {"n": 43, "week": "Week 7", "q": "In India, the ___ scheme provides health insurance to poor and vulnerable families and addresses challenges in health and wellbeing.", "o": ["Pradhan Mantri Jan Arogya Yojana", "Jal Jeevan Mission", "Mission Indradhanush", "Swachh Bharat Abhiyan"], "a": 0}, {"n": 44, "week": "Week 7", "q": "The four pillars of sustainability (4 Ps) are Human, Economic, Environmental and ___.", "o": ["Social", "Technological", "Political", "Cultural"], "a": 0}, {"n": 45, "week": "Week 7", "q": "Subjective wellbeing often includes assessments that measure ___.", "o": ["social conformity", "behavioural difficulties", "life satisfaction", "cognitive distortion"], "a": 0}, {"n": 46, "week": "Week 8", "q": "ESD is explicitly recognized in the SDGs as part of Target ___ of the SDG on education.", "o": ["4.9", "4.2", "4.7", "4.1"], "a": 2}, {"n": 47, "week": "Week 8", "q": "Which of the following is NOT true about ESD?", "o": ["It is transformative", "It links formal and informal learning", "It creates teacher-centred teaching settings", "It is holistic"], "a": 2}, {"n": 48, "week": "Week 8", "q": "Publication of CSR/sustainability reports is often part of the ___ level of corporate sustainability.", "o": ["surface", "underlying", "core", "value"], "a": 2}, {"n": 49, "week": "Week 8", "q": "The social justice agenda of education for social transformation highlights the issue of ___.", "o": ["supply chain management", "change management", "profit margins", "power and politics"], "a": 0}, {"n": 50, "week": "Week 8", "q": "The Inner Development Goals (IDG) framework consists of five dimensions and ___ skills.", "o": ["23", "17", "30", "12"], "a": 3}];let list=[...Q],i=0,sel={},done={};const $=x=>document.getElementById(x);function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let q=list[i],k=q.n,s=sel[k],d=done[k];$('week').textContent=q.week;$('prog').textContent=`Question ${i+1} of ${list.length}`;let c=Q.filter(x=>done[x.n]&&sel[x.n]===x.a).length;$('score').textContent=`Score ${c*2}/100`;$('bar').style.width=((i+1)/list.length*100)+'%';let opts=q.o.map((x,j)=>{let cl='w-full text-left p-4 rounded-xl border-2 flex items-center gap-3 ';let b='w-10 h-10 rounded-full flex items-center justify-center font-bold border flex-shrink-0 ';if(d&&j===q.a){cl+='border-green-500 bg-green-50';b+='bg-green-600 text-white border-green-600'}else if(d&&j===s){cl+='border-red-500 bg-red-50';b+='bg-red-600 text-white border-red-600'}else if(!d&&j===s){cl+='border-blue-600 bg-blue-100 ring-2 ring-blue-300';b+='bg-blue-600 text-white border-blue-600'}else{cl+='border-slate-200 hover:border-blue-400';b+='bg-slate-50 border-slate-300'}return `<button ${d?'disabled':''} class="${cl}" onclick="choose(${j})"><span class="${b}">${String.fromCharCode(65+j)}</span><span>${esc(x)}</span></button>`}).join('');let fb=d?`<div class="mt-5 p-4 rounded-xl border ${s===q.a?'bg-green-50 border-green-300 text-green-800':'bg-red-50 border-red-300 text-red-800'}"><b class="text-lg">${s===q.a?'✅ Correct Answer!':'❌ Incorrect Answer!'}</b><div class="mt-1">Correct Answer: <b>${String.fromCharCode(65+q.a)}. ${esc(q.o[q.a])}</b></div></div>`:'';$('card').innerHTML=`<div class="inline-block px-3 py-1 rounded-full bg-blue-100 text-blue-700 font-bold">${q.week}</div><h3 class="text-xl font-bold mt-4 leading-relaxed">Q${q.n}. ${esc(q.q)}</h3><div class="mt-5 space-y-3">${opts}</div>${fb}`;$('submit').disabled=d;$('clear').disabled=d;$('att').textContent=Object.keys(done).length;$('cor').textContent=c;$('wro').textContent=Object.keys(done).length-c;$('pal').innerHTML=list.map((x,j)=>`<button onclick="i=${j};render()" class="h-9 rounded-lg border font-bold ${j===i?'bg-blue-600 text-white':done[x.n]?'bg-green-500 text-white':sel[x.n]!==undefined?'bg-blue-200':'bg-slate-50'}">${x.n}</button>`).join('')}function choose(j){if(!done[list[i].n]){sel[list[i].n]=j;render()}}function submitA(){let k=list[i].n;if(sel[k]===undefined)return alert('Please select an option first.');done[k]=1;render()}function clearA(){if(!done[list[i].n]){delete sel[list[i].n];render()}}function next(){if(i<list.length-1)i++;else result();render()}function prev(){if(i>0)i--;render()}function applyFilter(){let v=$('filter').value;list=v==='All Weeks'?[...Q]:Q.filter(x=>x.week===v);i=0;render()}function result(){let a=Object.keys(done).length,c=Q.filter(x=>done[x.n]&&sel[x.n]===x.a).length;$('res').innerHTML=`<div class="grid grid-cols-2 gap-3 text-center"><div class="p-4 bg-blue-50 rounded-xl"><b class="text-3xl">${c*2}/100</b><div>Score</div></div><div class="p-4 bg-green-50 rounded-xl"><b class="text-3xl">${c}</b><div>Correct</div></div><div class="p-4 bg-red-50 rounded-xl"><b class="text-3xl">${a-c}</b><div>Wrong</div></div><div class="p-4 bg-slate-50 rounded-xl"><b class="text-3xl">${50-a}</b><div>Not Attempted</div></div></div>`;$('modal').classList.remove('hidden');$('modal').classList.add('flex')}function closeM(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}render();</script></body></html>
